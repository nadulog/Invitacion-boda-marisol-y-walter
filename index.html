<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2ece3">
  <meta name="description" content="Invitación a la boda de Walter y Marisol — 18 de diciembre de 2026.">
  <title>Walter & Marisol — 18.12.2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Ir al contenido</a>

  <main id="contenido" class="invitation">
    <section class="art-section" aria-label="Portada de la boda de Walter y Marisol">
      <img src="assets/sections/01-portada.png" alt="Nuestra boda, Walter y Marisol, 18 de diciembre de 2026">
    </section>

    <section class="art-section guest-art" aria-label="Invitación personalizada">
      <img src="assets/sections/02-invitados.png" alt="Esta invitación fue creada especialmente para vos">
      <p id="nombres-invitados" class="guest-name" aria-live="polite"></p>
      <p class="guest-count"><span>Tenés&nbsp;</span><strong id="cantidad-lugares" aria-live="polite"></strong><span>&nbsp;lugares reservados</span></p>
    </section>

    <section class="art-section" aria-label="Versículo elegido por los novios">
      <img src="assets/sections/03-versiculo.png" alt="Todo lo hizo hermoso en su tiempo. Eclesiastés 3:11. Tiempo de agradecer, bendecir, compartir y celebrar">
    </section>

    <section class="art-section countdown-art" aria-label="Cuenta regresiva para la boda">
      <img src="assets/sections/04-cuenta-regresiva.png" alt="Cuenta regresiva">
      <div class="countdown-values" role="timer" aria-label="Tiempo restante">
        <strong id="days">000</strong>
        <strong id="hours">00</strong>
        <strong id="minutes">00</strong>
        <strong id="seconds">00</strong>
      </div>
    </section>

    <section class="art-section date-art" aria-label="Fecha y horario">
      <img src="assets/sections/05-fecha.png" alt="Viernes 18 de diciembre de 2026 a las 19:30. Ceremonia y celebración">
      <button class="hotspot date-hotspot" id="calendarButton" type="button" aria-label="Agregar la boda al calendario"></button>
    </section>

    <section class="art-section location-art" aria-label="Ubicación de la celebración">
      <img src="assets/sections/06-como-llegar.png" alt="Azahares Eventos, Wilde 1561, Barrio La Reja Grande, Acceso Oeste kilómetro 41">
      <button class="hotspot location-hotspot" type="button" data-open-modal="locationModal" aria-label="Ver ubicación y opciones para llegar"></button>
    </section>

    <section class="art-section" aria-label="Código de vestimenta elegante">
      <img src="assets/sections/07-dress-code.png" alt="Dress code: elegante">
    </section>

    <section class="art-section gift-art" aria-label="Regalos">
      <img src="assets/sections/08-regalos.png" alt="El mejor regalo es compartir este momento con ustedes. Si desean hacernos un presente">
      <button class="hotspot gift-hotspot" type="button" data-open-modal="giftModal" aria-label="Ver datos para regalar"></button>
    </section>

    <section class="art-section music-art" aria-label="Música">
      <img src="assets/sections/11-musica.png" alt="Dale play a nuestra historia">
      <button class="hotspot music-hotspot" id="musicButton" type="button" aria-pressed="false" aria-label="Reproducir nuestra canción"></button>
      <p id="musicStatus" class="sr-status" aria-live="polite"></p>
      <audio id="weddingAudio" preload="metadata" loop><source src="assets/nuestra-cancion.mp3" type="audio/mpeg"></audio>
    </section>

    <section class="art-section bloomkeep-art" aria-label="Bloomkeep, álbum compartido">
      <img src="assets/sections/12-bloomkeep.png" alt="Nuestro álbum compartido. Subí tus fotos y ayudanos a guardar cada recuerdo">
      <a class="hotspot bloomkeep-hotspot" id="bloomkeepButton" href="https://app.bloomkeep.site/boda-marisol-walter" target="_blank" rel="noopener" aria-label="Ingresar al álbum compartido en Bloomkeep"></a>
    </section>

    <section class="photo-gallery" aria-label="Galería de Walter y Marisol">
      <img src="assets/couple-proposal.png" alt="Walter y Marisol durante su propuesta frente a la Fontana di Trevi" loading="lazy">
      <img src="assets/couple-smile.png" alt="Walter y Marisol sonríen juntos" loading="lazy">
      <img src="assets/couple-embrace.png" alt="Marisol besa a Walter frente a la Fontana di Trevi" loading="lazy">
      <img src="assets/couple-kiss.png" alt="Walter y Marisol se besan junto a la fuente" loading="lazy">
    </section>

    <section class="art-section rsvp-art" aria-label="Confirmación de asistencia">
      <img src="assets/sections/13-rsvp.png" alt="Confirmación de asistencia antes del primero de noviembre">
      <a class="hotspot rsvp-hotspot" id="boton-confirmar" href="https://bloomdate-rsvp.netlify.app" target="_blank" rel="noopener" aria-label="Confirmar asistencia"></a>
    </section>

    <footer class="plain-footer">
      <p class="footer-credit">Hecho con <span class="footer-love">amor
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6 4.2 13C-.7 8.3 6.4 1.1 11 5.6l1 1 1-1c4.6-4.5 11.7 2.7 6.8 7.4L12 20.6Z"/></svg>
      </span> por <strong>Bloomdate</strong></p>
      <div class="footer-icons" aria-label="Canales de Bloomdate">
        <span role="img" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.1 1.6 5.9L.2 24l6.5-1.7a11.8 11.8 0 0 0 5.4 1.4h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.3-6.2-3.5-8.4Zm-8.4 18.2c-1.8 0-3.6-.5-5.1-1.4l-.4-.2-3.9 1 1-3.8-.2-.4a9.8 9.8 0 1 1 8.6 4.8Zm5.4-7.3c-.3-.1-1.8-.9-2.1-1-.3-.1-.5-.1-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.6-2c-.2-.3 0-.5.1-.6l.5-.6.3-.5c.1-.2 0-.4 0-.5l-1-2.4c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1.1 1.1-1.1 2.7 0 1.6 1.2 3.1 1.3 3.3.2.2 2.3 3.5 5.6 4.9.8.3 1.4.5 1.9.6.8.2 1.5.2 2.1.1.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.2-.2-.5-.3-.8-.4Z"/></svg>
        </span>
        <span role="img" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.3"/><circle class="fill-dot" cx="17.6" cy="6.5" r="1.15"/></svg>
        </span>
        <span role="img" aria-label="Sitio web">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.8 12h18.4M12 2.5c2.4 2.6 3.7 5.8 3.7 9.5S14.4 18.9 12 21.5M12 2.5C9.6 5.1 8.3 8.3 8.3 12s1.3 6.9 3.7 9.5"/></svg>
        </span>
      </div>
      <p>Todos los derechos reservados</p>
    </footer>
  </main>

  <div class="modal" id="giftModal" role="dialog" aria-modal="true" aria-label="Datos para regalos" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__sheet modal__sheet--gift" tabindex="-1">
      <img src="assets/sections/09-regalos-modal.png" alt="Alias Marisol punto Barbieri">
      <div class="modal__drag" aria-label="Deslizar hacia abajo para cerrar"><span></span></div>
      <button class="hotspot modal-gift-copy" id="copyAlias" type="button" aria-label="Copiar alias Marisol punto Barbieri"></button>
      <button class="hotspot modal-gift-close" type="button" data-close-modal aria-label="Cerrar"></button>
    </div>
  </div>

  <div class="modal" id="locationModal" role="dialog" aria-modal="true" aria-label="Cómo llegar a Azahares Eventos" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__sheet modal__sheet--location" tabindex="-1">
      <img src="assets/sections/10-ubicacion-modal.png" alt="Azahares Eventos y opciones para llegar">
      <div class="modal__drag" aria-label="Deslizar hacia abajo para cerrar"><span></span></div>
      <a class="hotspot modal-map-google" href="https://www.google.com/maps/search/?api=1&query=Azahares+Eventos+Wilde+1561+La+Reja" target="_blank" rel="noopener" aria-label="Abrir en Google Maps"></a>
      <a class="hotspot modal-map-waze" href="https://www.waze.com/ul?q=Azahares%20Eventos%20Wilde%201561%20La%20Reja&navigate=yes" target="_blank" rel="noopener" aria-label="Abrir en Waze"></a>
      <button class="hotspot modal-map-copy" id="copyAddress" type="button" aria-label="Copiar dirección"></button>
      <button class="hotspot modal-map-close" type="button" data-close-modal aria-label="Cerrar"></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <button class="audio-toggle" id="audioToggle" type="button" aria-label="Encender música" aria-pressed="false">
    <span class="audio-toggle__note" aria-hidden="true">♫</span>
    <span class="audio-toggle__ring" aria-hidden="true"></span>
  </button>
  <script src="script.js"></script>
  <script src="assets/invitation-personalization.js"></script>
</body>
</html>
